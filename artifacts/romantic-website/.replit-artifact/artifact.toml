kind = "web"
previewPath = "/"
title = "Romantic Website"
version = "1.0.0"
id = "artifacts/romantic-website"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19824

[services.development]
run = "pnpm --filter @workspace/romantic-website run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/romantic-website", "run", "build" ]
publicDir = "artifacts/romantic-website/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19824"
BASE_PATH = "/"
